<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="referrer" content="no-referrer">
  <title>Minecraft Studio Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect width='8' height='8' fill='%23794f2f'/%3E%3Crect width='8' height='3' fill='%235ccf6a'/%3E%3Crect y='3' width='1' height='1' fill='%235ccf6a'/%3E%3Crect x='3' y='3' width='2' height='1' fill='%235ccf6a'/%3E%3Crect x='7' y='3' width='1' height='2' fill='%235ccf6a'/%3E%3Crect x='1' width='2' height='1' fill='%238fe39a'/%3E%3Crect x='5' y='1' width='1' height='1' fill='%238fe39a'/%3E%3Crect x='2' y='5' width='1' height='1' fill='%235a3820'/%3E%3Crect x='5' y='6' width='1' height='1' fill='%235a3820'/%3E%3Crect x='6' y='4' width='1' height='1' fill='%23a06a3c'/%3E%3Crect x='1' y='7' width='1' height='1' fill='%23a06a3c'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply the persisted theme before first paint (no flash).
    try { var t = JSON.parse(localStorage.getItem('mcs.theme') || 'null'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app">
    <aside class="sidebar" aria-label="Primary">
      <a class="brand" href="#/overview" aria-label="Minecraft Studio — Overview">
        <svg class="logo" viewBox="0 0 16 16" width="34" height="34" shape-rendering="crispEdges" aria-hidden="true">
          <rect width="16" height="16" rx="0" fill="#3b2617"/>
          <rect x="1" y="1" width="14" height="14" fill="#794f2f"/>
          <rect x="1" y="1" width="14" height="5" fill="#5ccf6a"/>
          <rect x="1" y="6" width="2" height="2" fill="#5ccf6a"/>
          <rect x="5" y="6" width="3" height="1" fill="#5ccf6a"/>
          <rect x="10" y="6" width="2" height="2" fill="#5ccf6a"/>
          <rect x="13" y="6" width="2" height="1" fill="#5ccf6a"/>
          <rect x="3" y="2" width="2" height="1" fill="#8fe39a"/>
          <rect x="9" y="3" width="2" height="1" fill="#8fe39a"/>
          <rect x="12" y="2" width="1" height="1" fill="#8fe39a"/>
          <rect x="4" y="9" width="1" height="1" fill="#5a3820"/>
          <rect x="9" y="11" width="2" height="1" fill="#5a3820"/>
          <rect x="12" y="9" width="1" height="1" fill="#a06a3c"/>
          <rect x="2" y="12" width="1" height="1" fill="#a06a3c"/>
          <rect x="6" y="13" width="1" height="1" fill="#5a3820"/>
          <rect x="7" y="8" width="1" height="1" fill="#a06a3c"/>
        </svg>
        <span class="brand-text"><strong>Minecraft Studio</strong><span class="brand-sub">Production dashboard</span></span>
      </a>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-foot" id="sidebar-foot"></div>
    </aside>

    <div class="main-col">
      <header class="topbar">
        <div class="crumbs" id="crumbs" aria-live="polite"></div>
        <div class="search" role="search">
          <label class="visually-hidden" for="global-search">Search assets</label>
          <span class="search-icon" aria-hidden="true"></span>
          <input id="global-search" type="search" placeholder="Search assets by name or id" autocomplete="off" spellcheck="false"
                 role="combobox" aria-expanded="false" aria-controls="search-results" aria-autocomplete="list">
          <kbd class="search-kbd" aria-hidden="true">/</kbd>
          <ul id="search-results" class="search-results" role="listbox" hidden></ul>
        </div>
        <div class="top-actions">
          <span id="live" class="live" role="status" title="Live updates"></span>
          <button id="theme-toggle" class="btn btn-icon" type="button" aria-label="Switch theme"></button>
        </div>
      </header>
      <main id="main" class="main" tabindex="-1"></main>
    </div>
  </div>
  <noscript><p style="padding:2rem">The Minecraft Studio dashboard needs JavaScript.</p></noscript>
</body>
</html>
