# IndustrialReactor configuration (Minecraft Studio demo).

# Message language: en or ru (see "messages" below).
language: en

# Players within this many blocks of an active reactor hear its adaptive music and see its boss bar.
music-radius: 48
# Music sound events are <prefix><calm|alarm>_<intro|loop|outro>, e.g. reactor:reactor.music.calm_loop.
music-sound-prefix: "reactor:reactor.music."
# Voice announcements are audible within this radius.
voice-radius: 32
# Minimum gap between two voice lines of the same reactor (ticks); prevents overlapping speech.
voice-min-gap-ticks: 50

heat:
  # Heat (%) gained per second at 100% power.
  gain-at-full-power: 2.0
  # Heat removed per second while coolant pumps are ON.
  coolant-cooling: 1.5
  # Heat always dissipated per second.
  passive-cooling: 0.3
  warning-threshold: 70
  critical-threshold: 90
  failure-threshold: 100
  # WARNING/CRITICAL fall back to RUNNING below this heat (hysteresis).
  resume-threshold: 65
  # CRITICAL falls back to WARNING below critical-threshold minus this value.
  critical-hysteresis: 5

# Default power (%) of a freshly placed reactor.
default-power: 50
# Light level placed above a running core when a timeline does not say otherwise.
running-light-level: 12
# Rotor idle speed in degrees per tick (max 18 = 90 degrees per 5 tick interpolation step).
rotor-speed: 18
# Range in blocks in which the Control Panel item opens the nearest reactor.
panel-range: 8

autosave-minutes: 5
bossbar: true

